name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Build
        run: dotnet build source/SocialGoal.sln -c Release
      - name: Unit tests
        run: dotnet test source/SocialGoal.sln -c Release --no-build

      - name: Start SQL Server
        run: |
          export MSSQL_SA_PASSWORD="Ci1!$(openssl rand -hex 16)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "ConnectionStrings__SocialGoalEntities=Server=localhost,1433;Database=SocialGoal;User Id=sa;Password=$MSSQL_SA_PASSWORD;MultipleActiveResultSets=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
          timeout 120 bash -c 'until docker logs sql 2>&1 | grep -q "Recovery is complete"; do sleep 2; done'

      - name: Start the app
        run: |
          dotnet run --project source/SocialGoal -c Release --no-build > app.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:5002/Account/Login; do sleep 2; done'

      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Production smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5003
        run: |
          dotnet run --project source/SocialGoal -c Release --no-build --no-launch-profile > app-prod.log 2>&1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:5003/Account/Login; do sleep 2; done'
          curl -sf -o /dev/null http://localhost:5003/Content/bootstrap.css

      - name: Upload report and app log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            app.log
            app-prod.log
            e2e/playwright-report
